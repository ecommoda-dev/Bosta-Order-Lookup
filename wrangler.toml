name               = "bosta-order-lookup-worker"
main               = "index.js"
compatibility_date = "2025-01-01"
workers_dev        = true


[observability]
enabled = true

# ─── D1 (ecommoda-constants §2) ───────────────────────
# الاسم لازم يفضل "DB" — أي اسم تاني = كتابة فاشلة بصمت.
# اتضاف في v2.0.0: الأداة بقى فيها Universal D1 Auth + سجل عمليات.
[[d1_databases]]
binding       = "DB"
database_name = "ecommoda-dev-logs"
database_id   = "90db62d3-bd7e-4d92-912b-10fc78eeb565"

# ─── Vars (نص عادي — مش أسرار) ────────────────────────
# دي بتتطبّق فعليًا مع Workers Builds.
[vars]
SHOP_DOMAIN = "6c7e1a-53.myshopify.com"

# ⚠️ الأسرار مبتتكتبش هنا أبدًا.
#    Worker → Settings → Variables and Secrets → علّم Secret:
#    WORKER_SECRET · BOSTA_API_KEY · CLIENT_ID · CLIENT_SECRET
#    وبعدها: Deployments → Version History → ⋯ → Promote version
#
# 🔴 WORKER_SECRET جديد في v2.0.0 — من غيره الـ Worker بيرد 500 على كل نداء
#    برسالة صريحة (مش 401 غامضة). ده مقصود: الحماية مش اختيارية.
