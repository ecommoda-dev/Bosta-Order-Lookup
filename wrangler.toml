name               = "bosta-order-lookup-worker"
main               = "index.js"
compatibility_date = "2025-01-01"
workers_dev        = true


[observability]
enabled = true

# ─── D1 (ecommoda-constants §2) ───────────────────────
# الاسم لازم يفضل "DB" — أي اسم تاني = كتابة فاشلة بصمت.
# اتضاف في v2.0.0: الأداة بقى فيها Universal D1 Auth + سجل عمليات.
[[d1_databases]]
binding       = "DB"
database_name = "ecommoda-dev-logs"
database_id   = "90db62d3-bd7e-4d92-912b-10fc78eeb565"

# ⚠️ الأسرار مبتتكتبش هنا أبدًا.
#    Worker → Settings → Variables and Secrets → علّم Secret:
#    WORKER_SECRET · BOSTA_API_KEY
#    وبعدها: Deployments → Version History → ⋯ → Promote version
